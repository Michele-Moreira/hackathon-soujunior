backend:
  name: github
  repo: Michele-Moreira/hackathon-soujunior
  branch: main
  base_url: https://hackathon-soujunior.vercel.app
  auth_endpoint: api/auth
  auth_scope: public_repo
  commit_messages:
    update: 'content(site): update {{collection}} from the cms'

local_backend: true

locale: pt
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: site
    label: Conteúdo do site
    editor:
      preview: false
    files:
      - name: landing
        label: Landing page
        file: src/content/site.json
        format: json
        fields:
          - name: header
            label: Cabeçalho
            widget: object
            fields:
              - name: nav
                label: Menu de navegação
                label_singular: Item do menu
                widget: list
                fields:
                  - { name: label, label: Texto, widget: string }
                  - { name: href, label: Âncora da seção, widget: string, hint: 'Aponta para uma seção da página, como #missao. Só mude se a seção mudar de nome.' }
              - { name: supportLabel, label: Texto do botão de apoio, widget: string }

          - name: hero
            label: Tela inicial
            widget: object
            fields:
              - { name: eyebrow, label: Etiqueta, widget: string, hint: 'Texto da pílula azul no topo da seção.' }
              - { name: title, label: Título, widget: string }
              - { name: description, label: Descrição, widget: text }
              - { name: supportLabel, label: Texto do botão de apoio, widget: string }

          - name: mission
            label: Missão
            widget: object
            fields:
              - { name: eyebrow, label: Etiqueta, widget: string }
              - { name: title, label: Título, widget: string }
              - { name: description, label: Descrição, widget: text }
              - name: cards
                label: Caixas de missão e visão
                label_singular: Caixa
                widget: list
                fields:
                  - { name: title, label: Título, widget: string }
                  - { name: text, label: Texto, widget: text }

          - name: whatWeDo
            label: Atuação
            widget: object
            fields:
              - { name: eyebrow, label: Etiqueta, widget: string }
              - { name: title, label: Título, widget: string }
              - { name: description, label: Descrição, widget: text }
              - name: pillars
                label: Pilares de atuação
                label_singular: Pilar
                widget: list
                fields:
                  - { name: icon, label: Ícone, widget: select, options: [code, graduation, users, github] }
                  - { name: title, label: Título, widget: string }
                  - { name: description, label: Descrição, widget: text }
              - name: programs
                label: Programas
                label_singular: Programa
                widget: list
                fields:
                  - { name: title, label: Título, widget: string }
                  - { name: description, label: Descrição, widget: text }

          - name: impact
            label: Impacto
            widget: object
            fields:
              - { name: eyebrow, label: Etiqueta, widget: string }
              - { name: title, label: Título, widget: string }
              - { name: description, label: Descrição, widget: text }
              - { name: communityTitle, label: Título do primeiro grupo, widget: string }
              - name: communityStats
                label: Números da comunidade
                label_singular: Número
                widget: list
                fields:
                  - { name: value, label: Número, widget: string, hint: 'Como deve aparecer na tela, por exemplo 35 ou +50.' }
                  - { name: label, label: Legenda, widget: string }
              - { name: networkTitle, label: Título do segundo grupo, widget: string }
              - name: networkStats
                label: Números da rede de apoio
                label_singular: Número
                widget: list
                fields:
                  - { name: value, label: Número, widget: string }
                  - { name: label, label: Legenda, widget: string }

          - name: funding
            label: Financiamento
            widget: object
            fields:
              - { name: eyebrow, label: Etiqueta, widget: string }
              - { name: title, label: Título, widget: string }
              - { name: description, label: Descrição, widget: text }
              - name: cards
                label: Caixas de financiamento
                label_singular: Caixa
                widget: list
                fields:
                  - { name: icon, label: Ícone, widget: select, options: [heart, server, refresh, users] }
                  - { name: title, label: Título, widget: string }
                  - { name: description, label: Descrição, widget: text }
              - name: destinations
                label: Para onde vai o apoio
                label_singular: Destino
                widget: list
                fields:
                  - { name: icon, label: Ícone, widget: select, options: [server, briefcase, users, star] }
                  - { name: label, label: Destino, widget: string }
                  - { name: detail, label: Valor ou detalhe, widget: string, required: false, hint: 'Opcional. Aparece em letra menor abaixo do destino, por exemplo: cerca de R$ 375 por mês.' }

          - name: community
            label: Faça parte
            widget: object
            fields:
              - { name: eyebrow, label: Etiqueta, widget: string }
              - { name: title, label: Título, widget: string }
              - { name: description, label: Descrição, widget: text }
              - name: personas
                label: Formas de contribuir
                label_singular: Forma
                widget: list
                fields:
                  - { name: icon, label: Ícone, widget: select, options: [users, message, briefcase] }
                  - { name: title, label: Título, widget: string }
                  - { name: quote, label: Frase em itálico, widget: string, hint: 'As aspas são colocadas pelo site, não escreva aspas aqui.' }
                  - { name: description, label: Descrição, widget: text }

          - name: support
            label: Apoie
            widget: object
            fields:
              - { name: eyebrow, label: Etiqueta, widget: string }
              - { name: title, label: Título, widget: string }
              - { name: description, label: Descrição, widget: text }
              - { name: supportLabel, label: Texto do botão de apoio, widget: string }
              - name: tiers
                label: Valores de apoio
                label_singular: Valor
                widget: list
                fields:
                  - { name: value, label: Valor, widget: string, hint: 'Como deve aparecer na tela, por exemplo R$2.' }
                  - { name: title, label: Título, widget: string }
                  - { name: description, label: Descrição, widget: text }

          - name: footer
            label: Rodapé
            widget: object
            fields:
              - { name: tagline, label: Frase de assinatura, widget: string }
              - name: links
                label: Links do rodapé
                widget: object
                hint: 'Só o texto do link. Para onde cada um aponta é definido no código.'
                fields:
                  - { name: apoiase, label: Apoia.se, widget: string }
                  - { name: discord, label: Discord, widget: string }
                  - { name: whatsapp, label: WhatsApp, widget: string }
                  - { name: github, label: GitHub, widget: string }
                  - { name: site, label: Site institucional, widget: string }
              - { name: copyright, label: Direitos autorais, widget: string }
              - { name: campaign, label: Linha da campanha, widget: string }
